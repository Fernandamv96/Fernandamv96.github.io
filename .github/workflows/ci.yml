name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (eslint + html-validate)
        run: npm run lint

      - name: Build (data.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-data.mjs data.json

      - name: Lighthouse CI (≥ 95 en las 4 categorías)
        run: npx --yes @lhci/cli@0.14.0 autorun
